<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Webkinz Trading Hub - Items</title> 
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head> 
    <body> 
        <div class="site-background-items" aria-hidden="true">
            <img class="site-item item-blue-one" src="https://static.wikitide.net/webkinzguidewiki/b/bc/Bluebutterflybed.png" alt="">
            <img class="site-item item-blue-two" src="https://static.wikitide.net/webkinzguidewiki/a/a1/Blueavenuebed.png" alt="">
            <img class="site-item item-pink-one" src="https://static.wikitide.net/webkinzguidewiki/d/d8/Ballerinabed.png" alt="">
            <img class="site-item item-pink-two" src="https://static.wikitide.net/webkinzguidewiki/9/92/Cherryblossombed.png" alt="">
            <img class="site-item item-yellow-one" src="https://static.wikitide.net/webkinzguidewiki/8/8d/Daffodilbed.png" alt="">
            <img class="site-item item-yellow-two" src="https://static.wikitide.net/webkinzguidewiki/1/17/Plushgiraffebed.png" alt="">
        </div>
        <header>
            <div class="pageTitle">
                <h1><a style="text-decoration: none;" href="index.html">Webkinz Trading Hub</a></h1>
                <h2>A place to organize trades, keep track of your inventory, and create a wishlist.</h2>
            </div>
            <div id="accountButtons">
                <button id="loginButton" class="headerButton" type="button">Login</button>
                <button id="registerButton" class="headerButton" type="button">Register</button>
            </div>
        </header>
        <main>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a class="active" href="collections.html" aria-current="page">Browse</a>
                <a href="all-items.html">All Items</a>
                <a href="inventory.html">Inventory</a>
                <a href="wishlist.html">Wishlist</a>
            </nav>
            <nav class="card pink" style="margin-bottom: 60px;">
                <h2>Browse Items</h2>
                <div class="tabs">
                    <button id="type-button" class="tab-links" onclick="openCollection(event, 'type')">Type</button>
                    <button id="theme-button" class="tab-links" onclick="openCollection(event, 'theme')">Theme</button>
                    <button id="color-button" class="tab-links" onclick="openCollection(event, 'color')">Color</button>
                    <button id="misc-button" class="tab-links" onclick="openCollection(event, 'misc')">Misc</button>
                </div>
                <h3><a href="all-items.html">View All</a></h3>
            </nav>
            <div id="type" class="tab-content card yellow">
                <h3>By Type</h3>
                <div class="items"></div>
            </div>
            <div id="theme" class="tab-content card yellow">
                <h3>By Theme</h3>
                <div class="items"></div>
            </div>
            <div id="color" class="tab-content card yellow">
                <h3>By Color</h3>
                <div class="items"></div>
            </div>
            <div id="misc" class="tab-content card yellow">
                <h3>By Misc</h3>
                <div class="items"></div>
            </div>
        </main>
        <script type="module" src="auth.js"></script>
    </body> 
</html>
