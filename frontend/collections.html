<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Webkinz Trading Hub - Items</title> 
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head> 
    <body> 
        <div class="site-background-items" aria-hidden="true">
            <img class="site-item item-blue-one" src="https://static.wikitide.net/webkinzguidewiki/b/b4/Bluefrosttree.png" alt="">
            <img class="site-item item-blue-two" src="https://static.wikitide.net/webkinzguidewiki/f/ff/Frostybluelamp.png" alt="">
            <img class="site-item item-pink-one" src="https://static.wikitide.net/webkinzguidewiki/1/19/Prettypinkroses.png" alt="">
            <img class="site-item item-pink-two" src="https://static.wikitide.net/webkinzguidewiki/d/da/Pinkheartsclock.png" alt="">
            <img class="site-item item-yellow-one" src="https://static.wikitide.net/webkinzguidewiki/a/a3/Yellowroseincrystalvase.png" alt="">
            <img class="site-item item-yellow-two" src="https://static.wikitide.net/webkinzguidewiki/6/6a/Colorfulrowhouseyellow.png" alt="">
            <img class="site-item item-blue-three" src="https://static.wikitide.net/webkinzguidewiki/d/d6/Blueleprechaunactionfigure.png" alt="">
            <img class="site-item item-blue-four" src="https://static.wikitide.net/webkinzguidewiki/7/74/Blueribbonwindmill.png" alt="">
            <img class="site-item item-pink-three" src="https://static.wikitide.net/webkinzguidewiki/a/ab/Pinkfountainofwow.png" alt="">
            <img class="site-item item-pink-four" src="https://static.wikitide.net/webkinzguidewiki/d/d1/Pinkpoodlealbumcover.png" alt="">
            <img class="site-item item-yellow-three" src="https://static.wikitide.net/webkinzguidewiki/5/53/Yellowbutterflywallpanel.png" alt="">
            <img class="site-item item-yellow-four" src="https://static.wikitide.net/webkinzguidewiki/6/63/Yellowleprechaunplushtoy.png" alt="">
        </div>
        <header>
            <div class="pageTitle">
                <h1><a class="site-logo" style="text-decoration: none;" href="index.html"><img class="site-logo-mark" src="trading-hub-logo.svg" alt="" aria-hidden="true">Webkinz Trading Hub</a></h1>
                <h2>A place to organize trades, keep track of your inventory, and create a wishlist.</h2>
            </div>
            <div id="accountButtons">
                <button id="loginButton" class="headerButton" type="button">Login</button>
                <button id="registerButton" class="headerButton" type="button">Register</button>
            </div>
        </header>
        <main>
            <nav class="card browse-items-card" style="margin-bottom: 60px;">
                <h2>Browse Items</h2>
                <div class="tabs">
                    <button id="type-button" class="tab-links" onclick="openCollection(event, 'type')">Type</button>
                    <button id="theme-button" class="tab-links" onclick="openCollection(event, 'theme')">Theme</button>
                    <button id="color-button" class="tab-links" onclick="openCollection(event, 'color')">Color</button>
                    <button id="misc-button" class="tab-links" onclick="openCollection(event, 'misc')">Misc</button>
                </div>
                <h3><a href="all-items.html">View All</a></h3>
            </nav>
            <div id="type" class="tab-content card yellow">
                <h3>By Type</h3>
                <div class="items"></div>
            </div>
            <div id="theme" class="tab-content card yellow">
                <h3>By Theme</h3>
                <div class="items"></div>
            </div>
            <div id="color" class="tab-content card yellow">
                <h3>By Color</h3>
                <div class="items"></div>
            </div>
            <div id="misc" class="tab-content card yellow">
                <h3>By Misc</h3>
                <div class="items"></div>
            </div>
        </main>
        <script type="module" src="auth.js"></script>
    </body> 
</html>
