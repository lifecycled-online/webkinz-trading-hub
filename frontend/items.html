<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Webkinz Trading Hub - Items</title> 
        <link rel="stylesheet" href="styles.css">
        <script src="items.js" defer></script>
    </head> 
    <body> 
        <div class="site-background-pets" aria-hidden="true">
            <img class="site-pet site-pet-yellow" src="https://static.wikitide.net/webkinzguidewiki/1/17/Plushgiraffebed.png" alt="">
            <img class="site-pet site-pet-blue" src="https://static.wikitide.net/webkinzguidewiki/c/c7/Smittenkittenbed.png" alt="">
            <img class="site-pet site-pet-pink" src="https://static.wikitide.net/webkinzguidewiki/6/67/Tickledpinkgrizzlybearbed.png" alt="">
        </div>
        <header>
            <div class="pageTitle">
                <h1><a style="text-decoration: none;" href="index.html">Webkinz Trading Hub</a></h1>
                <h2>A place to organize trades, keep track of your inventory, and create a wishlist.</h2>
            </div>
            <div id="accountButtons">
                <button id="loginButton" class="headerButton">Login</button>
                <button id="registerButton" class="headerButton">Register</button>
            </div>
        </header>
        <main>
            <nav class="card pink" style="margin-bottom: 60px;">
                <h2>Browsing Category: <span id="category-name"></span></h2>
                <h3><a href="collections.html">View Categories</a></h3>
            </nav>
            <div id="type" class="card yellow">
                <div style="padding-top: 20px;" id="items" class="items"></div>
            </div>
        </main>
    </body> 
</html>
