<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Webkinz Trading Hub - Items</title> 
        <link rel="stylesheet" href="styles.css">
        <script type="module" src="items.js"></script>
    </head> 
    <body> 
        <div class="site-background-items" aria-hidden="true">
            <img class="site-item item-blue-one" src="https://static.wikitide.net/webkinzguidewiki/b/bc/Bluebutterflybed.png" alt="">
            <img class="site-item item-blue-two" src="https://static.wikitide.net/webkinzguidewiki/a/a1/Blueavenuebed.png" alt="">
            <img class="site-item item-pink-one" src="https://static.wikitide.net/webkinzguidewiki/d/d8/Ballerinabed.png" alt="">
            <img class="site-item item-pink-two" src="https://static.wikitide.net/webkinzguidewiki/9/92/Cherryblossombed.png" alt="">
            <img class="site-item item-yellow-one" src="https://static.wikitide.net/webkinzguidewiki/8/8d/Daffodilbed.png" alt="">
            <img class="site-item item-yellow-two" src="https://static.wikitide.net/webkinzguidewiki/1/17/Plushgiraffebed.png" alt="">
        </div>
        <header>
            <div class="pageTitle">
                <h1><a style="text-decoration: none;" href="index.html">Webkinz Trading Hub</a></h1>
                <h2>A place to organize trades, keep track of your inventory, and create a wishlist.</h2>
            </div>
            <div id="accountButtons">
                <button id="loginButton" class="headerButton" type="button">Login</button>
                <button id="registerButton" class="headerButton" type="button">Register</button>
            </div>
        </header>
        <main>
            <nav class="card pink" style="margin-bottom: 60px;">
                <h2>Browsing Category: <span id="category-name"></span></h2>
                <h3><a href="collections.html">View Categories</a></h3>
            </nav>
            <div id="type" class="card yellow">
                <div style="padding-top: 20px;" id="items" class="items"></div>
            </div>
        </main>
        <script type="module" src="auth.js"></script>
    </body> 
</html>
